name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: ruff (branch files; legacy files keep their style)
        run: ruff check --select E,F,W,I,UP,B --ignore E501 tools/ tests/ evals/
      - run: pytest -q
      - run: python tools/build_plugin.py --check
      - run: python -m unittest tests.test_footprint -v
      - run: python tools/tier1_check.py
      - name: "release gate: tag must match PyPI release"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'EOF'
          import json
          import urllib.request
          r = json.load(urllib.request.urlopen('https://pypi.org/pypi/rishi-ai-mcp/json'))
          print('pypi live versions:', sorted(r.get('releases', {})))
          EOF
